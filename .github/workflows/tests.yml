name: Numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python tools/check_release.py
      - run: OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python experiments/test_numerical.py
      - run: python examples/quickstart.py --steps 40
